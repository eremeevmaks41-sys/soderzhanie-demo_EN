<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>Contents</title>
<!-- ═════════════════════════════════════════════════════════════════
     "Table of Contents" for a Telegram channel · mini app
     One page, no external dependencies. Hosting: GitHub Pages.
     Data: docs/posts.json (updated automatically by Actions).
     Settings: docs/config.js  (channel, color, license).
     ═════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --card2:#f1ead9; --text:#2b2417; --muted:#8a7f68;
  --accent:#9a6b15; --accent-soft:#efe2c6; --chip:#efe8d8; --chip-active:#9a6b15;
  --chip-active-text:#fffdf8; --line:#e6dcc4; --search:#fffdf8; --shadow:0 2px 10px rgba(80,60,20,.07);
}
html[data-theme="dark"]{
  --bg:#1c1a16; --card:#26231d; --card2:#2e2a22; --text:#ece5d5; --muted:#9a917d;
  --accent:#d8b25e; --accent-soft:#3a3428; --chip:#2e2a22; --chip-active:#d8b25e;
  --chip-active-text:#1c1a16; --line:#3a352b; --search:#26231d; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}

/* ── header ── */
header{display:flex;align-items:center;gap:12px;padding:10px 2px 14px}
.logo{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;
  background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
  font-size:24px;user-select:none;
}
.h-name{font-size:19px;font-weight:700;letter-spacing:.1px}
.h-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.h-share{
  margin-left:auto;flex:0 0 auto;width:36px;height:36px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line);background:transparent;color:var(--accent);
  border-radius:11px;font-size:16px;line-height:1;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.h-share:active{background:var(--accent-soft);transform:scale(.94)}
.h-open{
  flex:0 0 auto;text-decoration:none;font-size:13px;font-weight:600;
  color:var(--accent);border:1.5px solid var(--accent);border-radius:11px;padding:7px 12px;
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.h-open:active{background:var(--accent-soft);transform:scale(.96)}

/* ── search ── */
.search{position:relative;margin-bottom:10px}
.search input{
  width:100%;padding:11px 38px 11px 38px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--search);color:var(--text);font-size:15px;outline:none;
}
.search input:focus{border-color:var(--accent)}
/* iOS draws its own cross for type=search — hide it, we have our own */
.search input{-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:15px}
.search .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--muted);font-size:17px;padding:6px 8px;cursor:pointer;display:none;
  transition:color .12s ease, transform .12s ease;
}
.search .clr:active{color:var(--accent);transform:translateY(-50%) scale(.88)}

/* ── topics (chips) ── */
.chips{
  display:flex;gap:7px;overflow-x:auto;padding:2px 2px 12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1.5px solid var(--line);background:var(--chip);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  user-select:none;-webkit-user-select:none;
  transition:transform .12s ease, border-color .12s ease, color .12s ease, background .12s ease;
}
.chip:active{transform:scale(.93)}
.chip.active{background:var(--chip-active);color:var(--chip-active-text);border-color:var(--chip-active)}

/* ── dates and cards ── */
.day{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
.card{
  display:block;color:inherit;text-decoration:none; /* the card is a real <a> */
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;
  transition:background .12s ease, transform .12s ease;
}
.card:active,.card.pressed{background:var(--card2);transform:scale(.985)}
.c-top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.c-time{font-size:12px;color:var(--muted);flex:0 0 auto}
.c-title{font-size:15.5px;font-weight:700;line-height:1.35}
.c-prev{font-size:13.8px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.c-tag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2.5px 8px;font-weight:600}

/* ── view switch: Contents / Feed ── */
.views{display:flex;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-bottom:11px}
.views button{
  flex:1;border:0;background:transparent;color:var(--muted);
  font-size:13.5px;font-weight:700;padding:8px 0;border-radius:9px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:color .12s ease, background .12s ease;
}
.views button:active{color:var(--text)}
.views button.active{background:var(--chip-active);color:var(--chip-active-text)}

/* ── card grid (contents root and sections) ── */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.tcard{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:14px;cursor:pointer;box-shadow:var(--shadow);
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.tcard:active{background:var(--card2);transform:scale(.96)}
.t-ico{font-size:25px;line-height:1}
.t-title{font-size:14.5px;font-weight:700;margin-top:7px;line-height:1.3}
.t-n{font-size:12px;color:var(--muted);margin-top:3px}
.slabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:15px 2px 9px}
.tagwrap{display:flex;flex-wrap:wrap;gap:7px;margin:2px 2px 8px}
.back{
  display:block;width:100%;margin:2px 0 10px;padding:10px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--chip);color:var(--text);
  font-size:13.5px;font-weight:700;cursor:pointer;text-align:center;
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.back:active{background:var(--accent-soft);transform:scale(.98)}


/* ── states ── */
.more{
  display:block;width:100%;margin:14px 0 4px;padding:12px;border-radius:13px;
  border:1.5px dashed var(--accent);background:transparent;color:var(--accent);
  font-size:14.5px;font-weight:700;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.more:active{background:var(--accent-soft);transform:scale(.98)}
.state{padding:46px 20px;text-align:center;color:var(--muted)}
.state .big{font-size:40px;margin-bottom:10px}
.state .t{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.banner{
  display:none;background:#fdeaea;color:#8a2020;border:1px solid #f2c4c4;border-radius:12px;
  padding:10px 13px;font-size:13px;margin-bottom:10px;
}
html[data-theme="dark"] .banner{background:#3a2424;color:#e8b0b0;border-color:#5a3434}
.banner a{color:inherit;font-weight:700;text-decoration:underline}

/* ── footer (watermark) ── */
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
footer .lic{font-size:11px;opacity:.75}
</style>
<!-- ═══ TELEGRAM BRIDGE — official and REQUIRED ═══
     core.telegram.org/bots/webapps → "Initializing Mini Apps":
     "To connect your Mini App to the Telegram client, place the script
     telegram-web-app.js in the <head> tag before any other scripts".
     Without it window.Telegram.WebApp is NOT created — on iPhone tg=NO:
     no haptic, no theme, no openTelegramLink (root cause of the
     "no navigation" bug in versions 52-e…52-l). The same script is
     included in the head of the live MyRadio app — and navigation
     works there. ═══ -->
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">📖</div>
    <div>
      <div class="h-name" id="hName">Contents</div>
      <div class="h-sub" id="hSub">A catalog of the channel’s posts</div>
    </div>
    <button class="h-share" id="hShare" type="button" aria-label="Copy table of contents link" title="Copy link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    </button>
    <a class="h-open" id="hOpen" href="#">Channel</a>
  </header>

  <div class="banner" id="banner"></div>

  <div class="search">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="Search the contents…" autocomplete="off">
    <button class="clr" id="clr" aria-label="Clear">✕</button>
  </div>

  <div class="views" id="views" style="display:none">
    <button id="vToc" type="button">📖 Contents</button>
    <button id="vFeed" type="button">🕘 Feed</button>
  </div>

  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div id="state" class="state" style="display:none"></div>

  <footer>
    <div><b>Contents</b> · a catalog of Telegram channel posts · <span id="ver">v54-en</span></div>
    <div class="lic" id="licLine"></div>
  </footer>
</div>

<script src="config.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   "Table of Contents" for a Telegram channel · mini app core
   Flow: config.js → license → posts.json → render.
   No need to edit this file: everything is configured in config.js.
   ══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var SALT = 'SODERZHANIE-v1-7f3a';               // internal license salt
var PAGE_SIZE = 100;                            // cards per single page load
var cfg = window.SZ_CONFIG || {};

/* ── Telegram WebApp: theme and link opening ──
   The official script (see <head>) creates window.Telegram.WebApp even
   OUTSIDE Telegram — but there it is a dummy: in its source
   webAppVersion='6.0', webAppPlatform='unknown', postEvent goes nowhere.
   A real client always marks the mini app with tgWebApp* hash params
   (tgWebAppPlatform, tgWebAppData, tgWebAppVersion…). Therefore only a
   real mini-app context counts as the bridge — otherwise in a plain
   browser the fallbacks break (the ladder below would be shadowed by
   dead calls). */
var rawTg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var tg = null;
if (rawTg){
  var realBridge = (rawTg.platform && rawTg.platform !== 'unknown') ||
                   (rawTg.initData && String(rawTg.initData).length > 0) ||
                   /[?&#]tgWebApp/.test(window.location.href);
  tg = realBridge ? rawTg : null;
}
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

/* iOS Safari applies :active only if the page has a touchstart handler */
document.addEventListener('touchstart', function(){}, {passive:true});

/* ── haptic feedback: HapticFeedback exists in mobile Telegram;
   in a plain browser and on desktop the calls are silently ignored ── */
function haptic(style){
  if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
    try { tg.HapticFeedback.impactOccurred(style); } catch(e){}
  }
}
function hapticSelect(){
  if (tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged) {
    try { tg.HapticFeedback.selectionChanged(); } catch(e){}
  }
}
function hapticNotify(type){
  if (tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred) {
    try { tg.HapticFeedback.notificationOccurred(type); } catch(e){}
  }
}

/* ── Telegram native Back button: mirrors the internal "← …" button ── */
var tgBackWired = false;
function wireTgBack(){
  if (!tg || !tg.BackButton || tgBackWired) return;
  tgBackWired = true;
  try {
    tg.onEvent('backButtonClicked', function(){
      var b = document.getElementById('backBtn');
      if (b && b.style.display !== 'none') b.click();
    });
  } catch(e){}
}
function updateTgBack(){
  if (!tg || !tg.BackButton || !tgBackWired) return;
  var b = document.getElementById('backBtn');
  var need = !!(b && b.style.display === 'block');
  try { if (need) tg.BackButton.show(); else tg.BackButton.hide(); } catch(e){}
}

/* ── toast + link copying (share button) ── */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));'
      + 'transform:translateX(-50%) translateY(8px);background:rgba(25,20,10,.88);color:#fff;'
      + 'font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;'
      + 'opacity:0;transition:opacity .18s ease, transform .18s ease;'
      + 'pointer-events:none;z-index:50;max-width:86%;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(8px)';
  }, 1900);
}
function legacyCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}
function copyText(text, done){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function(){ done(true); },
      function(){ done(legacyCopy(text)); }
    );
  } else { done(legacyCopy(text)); }
}

function themeApply(){
  var p = (tg && tg.themeParams) || {};
  var dark = (tg && (p.bg_color ? isDark(p.bg_color) : (window.matchMedia('(prefers-color-scheme: dark)').matches)));
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  function isDark(hex){
    if (!hex) return false;
    var h = hex.replace('#','');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    return (0.299*r + 0.587*g + 0.114*b) < 128;
  }
}
/* the Telegram header and the background under the content are tinted
   to the app theme; meta theme-color — same for a plain browser */
function headerColorApply(){
  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  var m = document.querySelector('meta[name="theme-color"]');
  if (m && bg) m.setAttribute('content', bg);
  if (tg && tg.setHeaderColor) { try { tg.setHeaderColor(bg); } catch(e){ try { tg.setHeaderColor('bg_color'); } catch(e2){} } }
  if (tg && tg.setBackgroundColor) { try { tg.setBackgroundColor(bg); } catch(e){} }
}
themeApply();
headerColorApply();
if (tg && tg.onEvent) { try { tg.onEvent('themeChanged', function(){ themeApply(); headerColorApply(); }); } catch(e){} }

/* iOS/iPadOS: navigations via target="_blank" and window.open in the
   built-in Telegram browser on iPhone are SILENTLY BLOCKED (WKWebView
   cannot open new tabs) — the only reliable paths there: the official
   mini-app API or navigation in the same tab. */
var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); /* iPadOS 13+ masquerades as a Mac */
/* ── POST OPENING — the strategy of the live table-of-contents app
   MyRadio (the "From Reading to Transformation" channel), verified
   live on iOS 9.6 and Android 9.6, 2026-07-07 (notes from that
   project's code):

     Desktop Telegram → tg.openTelegramLink (opens inside Telegram)
     Telegram Web     → window.open (new browser tab)
     Mobile           → tg.openTelegramLink: navigation happens straight
                        into the channel, the mini app is NOT closed —
                        Telegram itself shows the channel over the app;
                        return by swipe or the system "Back" button.
                        This is exactly what Telegram intends for
                        iPhones.

   Known iOS quirk (our "post behind the app" case): if the mini app is
   launched FROM THE SAME channel whose post the link points to (for us
   — the pinned message with the contents button), openTelegramLink
   does NOT perform a visible navigation — no vibration, no
   minimization. The navigation itself still happens correctly in the
   background. Tracked via visibilitychange: if the app has not
   minimized within 1.5 s — the silent case, cured as described in the
   block below (WebApp.close()). */
/* ── ROOT CAUSE of the "no navigation" bug (52-e…52-l): the official
   telegram-web-app.js was not included in <head> — the only way the
   Telegram client creates window.Telegram.WebApp. Without it, on iPhone
   tg is always NO: haptic/theme/openTelegramLink do not exist, and none
   of the strategies below ever ran. Since 52-m the script is included
   in <head> — on iOS, entering via the pinned message/bot menu brings
   the bridge up (tg=yes). Confirmation: the head of the live MyRadio
   contains the same script. */
/* ── self-diagnostics line in the footer: records which environment the
   page was opened in and which navigation branch actually fired. Using
   it, the user can report precisely what happens on their device. */
var diagEl = null, diagLog = [];
function diagInit(){
  diagEl = document.createElement('div');
  diagEl.className = 'lic'; diagEl.id = 'diag';
  var f = document.querySelector('footer');
  if (f) f.appendChild(diagEl);
  diagNote('start: tg=' + (tg
    ? 'yes · platform=' + (tg.platform || '?') + ' · ver=' + (tg.version || '?')
    : (rawTg ? 'NO (dummy WebApp outside Telegram — ignoring)' : 'NO — plain page, no bridge')));
}
function diagNote(msg){
  if (!diagEl) return;
  var d = new Date(), z = function(x){ return ('0'+x).slice(-2); };
  diagLog.push(z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds())+' '+msg);
  if (diagLog.length > 4) diagLog = diagLog.slice(-4);
  diagEl.textContent = 'debug: ' + diagLog.join(' | ');
}

/* ── rescue banner: the page was opened WITHOUT the Telegram bridge
   (via a direct link — from a chat, browser history, etc.). The bridge
   cannot be created from inside the page (the client injects the
   environment only when opened as a mini app — official contract).
   But we can guide the reader to the proper entrance: the "Contents"
   pinned message in the channel, the bot's menu button, or the banner
   button (t.me/<bot>?startapp from config.js). */
function showBridgeBanner(){
  if (tg || !document.querySelector) return;
  var rescue = cfg.bot_username
    ? 'https://t.me/' + String(cfg.bot_username).replace(/^@/, '') + '?startapp'
    : (cfg.channel_url || '');
  if (!rescue) return;
  var b = document.createElement('div');
  b.className = 'banner'; b.id = 'tgBanner'; b.style.display = 'block';
  b.innerHTML = '<b>Telegram bridge unavailable:</b> the app was opened as a plain web page, '
    + 'so posts cannot be opened this way. Open the table of contents via the button in the '
    + 'channel’s pinned message or the bot menu button — or <a href="' + esc(rescue) + '">tap '
    + 'here for the proper entrance</a>.';
  var anchor = document.querySelector('.search');
  if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(b, anchor);
}

/* The silent case (same channel): openTelegramLink does perform the
   navigation in the BACKGROUND correctly — confirmed with the Safari
   inspector (MyRadio, 2026-07-08) — but there is no visible transition,
   the app stays on top of the already opened post.

   THE CURE (per the official docs at core.telegram.org/bots/webapps):
   1. openLink may be called "only in response to user interaction" —
      our former setTimeout fallback after 1.5 s violated that contract,
      so Telegram silently discarded it (and on iOS openLink also always
      opens external Safari — Telegram-iOS issue #1670).
   2. The documented WebApp.close() violates no contract: closing the
      app reveals the post already opened behind it (exactly what the
      inspector captured in MyRadio). */
var TG_LINK_FALLBACK_MS = 1500;
function openInTelegram(url){
  var settled = false;
  function onVisChange(){
    if (document.hidden){
      settled = true;
      document.removeEventListener('visibilitychange', onVisChange);
      diagNote('app minimized — post opened, swipe back to return');
    }
  }
  document.addEventListener('visibilitychange', onVisChange);
  try { tg.openTelegramLink(url); diagNote('openTelegramLink sent'); }
  catch(e){ diagNote('openTelegramLink error: ' + (e && e.message ? e.message : '?')); }
  setTimeout(function(){
    document.removeEventListener('visibilitychange', onVisChange);
    if (settled) return;
    if (tg.platform === 'ios' && tg.close){
      diagNote('not minimized in 1.5s → close() (post already opened in background)');
      try { tg.close(); } catch(e){}
      /* last resort if close is not supported by the client */
      setTimeout(function(){
        if (!settled && tg.openLink){
          diagNote('close did not work → openLink');
          try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
        }
      }, 800);
    } else if (tg.openLink){
      diagNote('not minimized in 1.5s → openLink');
      try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
    }
  }, TG_LINK_FALLBACK_MS);
}
function openPost(url){
  if (!url) return;
  if (!tg){
    /* outside the mini app: in Telegram's built-in browser target="_blank"
       and window.open are silently blocked (WKWebView cannot open new
       tabs) — navigation in the same tab saves the day; a plain desktop
       browser opens a new tab normally */
    if (iOS) { diagNote('no tg → location.href navigation (the post may open behind the window)'); window.location.href = url; return; }
    window.open(url, '_blank');
    return;
  }
  var plat = tg.platform || '';
  /* Telegram Web (web/weba) — in a new browser tab (as in MyRadio) */
  if (plat === 'web' || plat === 'weba') { window.open(url, '_blank'); return; }
  /* native apps (desktop, macOS, iOS, Android) — go straight into
     Telegram via openTelegramLink, without an external browser */
  var NATIVE_APP_PLATFORMS = {tdesktop:1, macos:1, ios:1, android:1, android_x:1};
  var canUseTelegramLink = !!tg.openTelegramLink
    && (!tg.isVersionAtLeast || tg.isVersionAtLeast('7.0'));
  if (NATIVE_APP_PLATFORMS[plat] && canUseTelegramLink) {
    openInTelegram(url);
    return;
  }
  /* unusual/unrecognized platform or a client older than Bot API 7.0 —
     fallback to the good old openLink(): a guaranteed visible working path */
  try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
}

/* ── license: sha256(licensee|salt), first 16 hex = key ── */
function hex(buf){
  var out = '';
  new Uint8Array(buf).forEach(function(b){ out += ('0'+b.toString(16)).slice(-2); });
  return out;
}
function licenseValid(licensee, key){
  if (!licensee || !key) return Promise.resolve(false);
  var data = new TextEncoder().encode(String(licensee).trim().toLowerCase() + '|' + SALT);
  if (!(window.crypto && crypto.subtle)) return Promise.resolve(false); // file:// — just show the banner
  return crypto.subtle.digest('SHA-256', data).then(function(d){
    return ('SZ-' + hex(d).slice(0,16)).toUpperCase() === String(key).trim().toUpperCase();
  });
}

/* ── utilities ── */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONTHS_NOM = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function dayLabel(iso){
  var d = new Date(iso + 'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  var yst = new Date(today.getTime() - 86400000);
  var t = new Date(d.getTime());
  if (t.getTime() === today.getTime()) return 'Today';
  if (t.getTime() === yst.getTime()) return 'Yesterday';
  var now = new Date();
  var label = MONTHS[d.getMonth()] + ' ' + d.getDate();
  if (d.getFullYear() !== now.getFullYear()) label += ', ' + d.getFullYear();
  return label;
}
function normTag(s){ return String(s||'').replace(/^#/,'').toLowerCase(); }

/* ── app state ── */
var POSTS = [];        // all posts (newest first)
var TAGS = [];         // [{tag, n}]
var TOPICS = null;     // [{id,title,icon,tags[]}] from topics.json (may be absent)
var view = 'feed';     // 'toc' | 'feed'
var filterTopic = null;// id of the selected topic (topics mode)
var filterMode = null; // universal grouping: 'months' | 'alpha' | 'kind' | 'topics'
var tocGroup = null;   // selected group inside filterMode
var filterTag = null;  // selected tag filter (as "Feed")
var filterQ = '';      // search query
var shown = PAGE_SIZE;

function topicOf(p){
  if (!TOPICS) return null;
  var pt = (p.tags||[]).map(normTag);
  for (var i = 0; i < TOPICS.length; i++){
    var tt = TOPICS[i].tags || [];
    for (var j = 0; j < tt.length; j++){
      if (pt.indexOf(normTag(tt[j])) !== -1) return TOPICS[i].id;
    }
  }
  return null;
}

/* ── universal grouping: months / alphabet / post type ── */
var MODES = [
  {id:'months', icon:'📅', title:'By month'},
  {id:'alpha',  icon:'🔤', title:'By alphabet'},
  {id:'kind',   icon:'🎭', title:'By post type'}
];
var KIND_META = {
  text:{icon:'📝', title:'Texts'}, photo:{icon:'📷', title:'Photos'},
  video:{icon:'🎬', title:'Videos'}, audio:{icon:'🎧', title:'Audio'},
  poll:{icon:'📊', title:'Polls'}, file:{icon:'📎', title:'Files'},
  sticker:{icon:'🎭', title:'Stickers'}
};
function kindOf(p){
  if (p.kind && KIND_META[p.kind]) return p.kind;
  var t = p.title || '';
  if (t.indexOf('📷') === 0) return 'photo';
  if (t.indexOf('🎬') === 0) return 'video';
  if (t.indexOf('🎧') === 0) return 'audio';
  if (t.indexOf('📊') === 0) return 'poll';
  if (t.indexOf('📎') === 0) return 'file';
  return 'text';
}
function groupKey(p, mode){
  var md = mode || filterMode;
  if (md === 'months') return (p.date || '').slice(0,7);
  if (md === 'alpha'){
    var t = (p.title || '').replace(/^[^0-9a-z\u0430-\u044f\u0451]+/i, '');
    return (t.charAt(0) || '#').toUpperCase();
  }
  return kindOf(p);
}
function monthLabel(ym){
  var m = parseInt(ym.slice(5,7), 10);
  return (MONTHS_NOM[m-1] || ym) + ' ' + ym.slice(0,4);
}
function groupCards(mode){
  var counts = {};
  POSTS.forEach(function(p){
    var k = groupKey(p, mode); if (!k) k = '#';
    if (!counts[k]) counts[k] = {key:k, n:0};
    counts[k].n++;
  });
  var arr = Object.keys(counts).map(function(k){ return counts[k]; });
  if (mode === 'months') arr.sort(function(a,b){ return a.key < b.key ? 1 : -1; });
  else if (mode === 'kind') arr.sort(function(a,b){ return b.n - a.n; });
  else arr.sort(function(a,b){ return a.key > b.key ? 1 : (a.key < b.key ? -1 : 0); });
  return arr;
}
function groupLabel(k){
  if (filterMode === 'months') return monthLabel(k);
  if (filterMode === 'kind') return (KIND_META[k] || {title:'Texts'}).title;
  return 'Starting with «' + k + '»';
}
function groupIcon(k){
  if (filterMode === 'months') return '📅';
  if (filterMode === 'kind') return (KIND_META[k] || {icon:'📝'}).icon;
  return k; // alphabet: the letter itself is the icon
}

/* ── "By topics" (v54-en): counter for the root card.
   If topics from topics.json cover posts — count topic cards
   (+ "Misc"), otherwise — the number of post tags. */
function topicCardCount(){
  if (TOPICS){
    var n = 0, covered = 0;
    TOPICS.forEach(function(t){
      var c = 0;
      POSTS.forEach(function(p){ if (topicOf(p) === t.id) c++; });
      if (c) n++;
      covered += c;
    });
    if (covered > 0){
      var misc = POSTS.length - covered, total = n + (misc > 0 ? 1 : 0);
      return { n: total, word: pluralWord(total, ['topic','topics','topics']) };
    }
  }
  return { n: TAGS.length, word: pluralWord(TAGS.length, ['tag','tags','tags']) };
}

/* ── filtering and render ── */
function pluralWord(n, forms){
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return forms[0];
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return forms[1];
  return forms[2];
}
function plural(n){ return pluralWord(n, ['post','posts','posts']); }
function filtered(){
  var q = filterQ.trim().toLowerCase();
  var inToc = view === 'toc' && !filterQ.trim();
  return POSTS.filter(function(p){
    if (inToc && filterTopic){
      var t = topicOf(p) || '__misc';
      if (t !== filterTopic) return false;
    } else if (inToc && filterMode && tocGroup){
      if (groupKey(p) !== tocGroup) return false;
    } else if (filterTag && !(p.tags||[]).some(function(t){ return normTag(t) === filterTag; })) return false;
    if (!q) return true;
    var hay = ((p.title||'') + ' ' + (p.preview||'') + ' ' + (p.tags||[]).join(' ')).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}
function renderChips(){

/* ── "By topics" screen (v54-en): topic cards from topics.json

function renderTopicsScreen(){

function renderModeGrid(){

function renderGroupCards(){
  showBack('← Contents',
           function(){ filterMode = null; tocGroup = null; shown = PAGE_SIZE; render(); });
  renderState(null);
  var list = document.getElementById('list');
  var cards = groupCards(filterMode);
  var html = '<div class="tgrid">';
  cards.forEach(function(c){
    html += '<div class="tcard" data-group="' + esc(c.key) + '">' +
              '<div class="t-ico">' + esc(groupIcon(c.key)) + '</div>' +
              '<div class="t-title">' + esc(groupLabel(c.key)) + '</div>' +
              '<div class="t-n">' + c.n + ' ' + plural(c.n) + '</div>' +

  list.querySelectorAll('.tcard').forEach(function(el){

function renderList(items){
  var list = document.getElementById('list');
  var html = '', lastDay = '', groupOpen = false;
  items.slice(0, shown).forEach(function(p){
    if (p.date !== lastDay){
      if (groupOpen){ html += '</div>'; }
      html += '<div class="day">' + esc(dayLabel(p.date)) + '</div><div class="group">';
      lastDay = p.date; groupOpen = true;
    }
    var tags = (p.tags||[]).map(function(t){ return '<span class="c-tag">' + esc(t) + '</span>'; }).join('');
    html += '<a class="card"' + (p.url ? ' href="' + esc(p.url) + '" target="_blank" rel="noopener"' : '') + '>' +
              '<div class="c-top">' +
                (p.time ? '<span class="c-time">' + esc(p.time) + '</span>' : '') +
                '<span class="c-title">' + esc(p.title || 'Post') + '</span>' +
              '</div>' +
              (p.preview ? '<div class="c-prev">' + esc(p.preview) + '</div>' : '') +
              (tags ? '<div class="c-tags">' + tags + '</div>' : '') +
            '</a>';
  });
  if (groupOpen) html += '</div>';
  list.innerHTML = html;
  list.querySelectorAll('a.card[href]').forEach(function(el){
    el.addEventListener('click', function(ev){
      if (ev.metaKey || ev.ctrlKey) return;   // ctrl/⌘+click — new tab is handled by the browser
      haptic('light');
      // mini app → openPost: navigation into Telegram, and on a silent iOS
      // failure (the mini app opened from the same channel) — visible browser fallback;
      // desktop browser without tg → do NOT intercept: the real href works
      if (tg || iOS) {
        ev.preventDefault();
        /* instant visual feedback while Telegram performs the navigation
           (up to 1.5 s) — the tap does not feel "dead" (MyRadio experience) */
        el.classList.add('pressed');
        setTimeout(function(){ el.classList.remove('pressed'); }, 300);
        openPost(el.getAttribute('href'));
      }
    });
  });
  var more = document.getElementById('moreBtn');
  if (items.length > shown){
    if (!more){
      more = document.createElement('button');
      more.id = 'moreBtn'; more.className = 'more';
      more.onclick = function(){ haptic('light'); shown += PAGE_SIZE; render(); };
      document.getElementById('list').after(more);
    }
    more.textContent = 'Show more (' + (items.length - shown) + ')';
    more.style.display = 'block';
  } else if (more){ more.style.display = 'none'; }
}
function renderState(kind, extra){
  var st = document.getElementById('state');
  var list = document.getElementById('list');
  var more = document.getElementById('moreBtn');
  if (more) more.style.display = 'none';
  if (!kind){ st.style.display = 'none'; list.style.display = ''; return; }
  list.style.display = 'none';
  st.style.display = 'block';
  if (kind === 'empty')   st.innerHTML = '<div class="big">📭</div><div class="t">Nothing here yet</div><div>Posts will appear here right after the first publication or import.</div>';
  if (kind === 'nomatch') st.innerHTML = '<div class="big">🔍</div><div class="t">Nothing found</div><div>Try changing the query or picking another topic.</div>';
  if (kind === 'error'){
    document.getElementById('chips').style.display = 'none';
    st.innerHTML = '<div class="big">⚠️</div><div class="t">Failed to load the table of contents</div><div>' + esc(extra||'') + '</div>'
      + '<button type="button" class="more" id="retryBtn" style="max-width:220px;margin:18px auto 0">Retry</button>';
    var rb = document.getElementById('retryBtn');
    if (rb) rb.onclick = function(){ haptic('light'); load(); loadTopics(); };
  }
}
function render(){
  var items = filtered();
  var q = filterQ.trim();
  var inToc = view === 'toc' && !q;
  var sub = POSTS.length ? ('A catalog of ' + POSTS.length + ' ' + plural(POSTS.length)) : 'A catalog of the channel’s posts';
  if (inToc && filterMode && filterMode !== 'topics' && !tocGroup){
    var gn = groupCards().length;
    sub = gn + ' ' + pluralWord(gn, ['section','sections','sections']);
  } else if (inToc && filterMode === 'topics' && !filterTopic && !filterTag){
    var tc = topicCardCount();
    sub = tc.n + ' ' + tc.word;
  }
  document.getElementById('hSub').textContent = sub;
  renderViews();
  document.getElementById('chips').style.display = inToc ? 'none' : '';
  if (!POSTS.length){ renderChips(); return renderState('empty'); }
  if (inToc && !filterMode && !filterTopic && !tocGroup && !filterTag){ renderModeGrid(); return; }  // v54-en root: 4 cards
  if (inToc && filterMode === 'topics' && !filterTopic && !filterTag){ renderTopicsScreen(); return; }
  if (inToc && filterMode && filterMode !== 'topics' && !tocGroup){ renderGroupCards(); return; }
  if (inToc && filterTopic){
    showBack('← Topics', function(){ filterTopic = null; shown = PAGE_SIZE; render(); });
  } else if (inToc && filterMode && tocGroup){
    showBack('← Sections', function(){ tocGroup = null; shown = PAGE_SIZE; render(); });
  } else if (inToc && filterTag){
    showBack('← Topics', function(){ filterTag = null; shown = PAGE_SIZE; render(); });
  } else { hideBack(); }
  renderChips();
  if (!items.length) return renderState('nomatch');
  renderState(null);
  renderList(items);
  document.getElementById('list').style.display = '';
}

/* ── data loading ── */
var RAW_TOPICS = null;    // contents of topics.json (if present)
var POSTS_READY = false;  // posts.json loaded
function tryApplyTopics(){
  if (!RAW_TOPICS || !POSTS_READY) return;
  var ts = (RAW_TOPICS && RAW_TOPICS.topics) || [];
  TOPICS = ts.filter(function(t){ return t && t.id && (t.tags||[]).length; });
  if (!TOPICS.length) TOPICS = null;
  render();   // v54-en: topics live inside the "By topics" card — the root is always the same
}
function loadTopics(){
  fetch('topics.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){ RAW_TOPICS = data; tryApplyTopics(); })
    .catch(function(){ if (POSTS_READY) render(); });   // topics.json missing/unavailable — the current view stays
}
function boot(data){
  var posts = Array.isArray(data) ? data : (data.posts || []);
  POSTS = posts.map(function(p){
    var d = String(p.date || '');
    return {
      date: d.slice(0,10), time: String(p.time || (d.length > 10 ? d.slice(11,16) : '')),
      title: p.title || '', preview: p.preview || '',
      tags: p.tags || [], kind: p.kind || '', url: p.url || ''
    };
  }).sort(function(a,b){
    var ka = a.date + ' ' + a.time, kb = b.date + ' ' + b.time;
    return ka < kb ? 1 : (ka > kb ? -1 : 0);
  });
  if (!POSTS_READY && cfg.default_view !== 'feed') view = 'toc';   // default view — only on first load
  var counts = {};
  POSTS.forEach(function(p){ (p.tags||[]).forEach(function(t){
    var k = normTag(t); if (!k) return;
    if (!counts[k]) counts[k] = {tag: t, n: 0};
    counts[k].n++;
  });});
  TAGS = Object.keys(counts).map(function(k){ return counts[k]; })
    .sort(function(a,b){ return b.n - a.n; });
  POSTS_READY = true;
  render();
  tryApplyTopics();
}

/* ── data loading: instant start from cache + silent refresh ──
   posts.json is saved to localStorage after each successful load:
   on a slow network the table of contents opens instantly (the saved
   copy), then silently refreshes; without network the copy is shown. */
var CACHE_KEY = 'sz_posts_v1';
function cacheRead(){
  try {
    var o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return (o && typeof o.raw === 'string') ? o : null;
  } catch(e){ return null; }
}
function stampFresh(t){
  if (!t) return;
  var el = document.getElementById('fresh');
  if (!el){
    el = document.createElement('div');
    el.className = 'lic'; el.id = 'fresh';
    var f = document.querySelector('footer');
    if (f) f.insertBefore(el, document.getElementById('licLine'));
  }
  var d = new Date(t), z = function(x){ return ('0' + x).slice(-2); };
  el.textContent = 'data updated: ' + z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function bootFromCache(){
  var cached = cacheRead();
  if (!cached) return null;
  try {
    var cd = JSON.parse(cached.raw);
    var cn = Array.isArray(cd) ? cd.length : ((cd && cd.posts) ? cd.posts.length : 0);
    if (cn) { boot(cd); stampFresh(cached.t); }   // empty cache is not shown — let the network decide
    return cached;
  } catch(e){ return null; }
}
function load(){
  var cached = bootFromCache();
  fetch('posts.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(txt){
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), raw: txt})); } catch(e){}
      if (cached && txt === cached.raw){ stampFresh(Date.now()); return; }   // data unchanged
      boot(JSON.parse(txt));
      stampFresh(Date.now());
    })
    .catch(function(e){
      if (!POSTS_READY) renderState('error', 'posts.json is unavailable or empty. Check the configuration per the guide (' + e.message + ').');
    });
}

/* ── start ── */
applyConfig();
wireTgBack();

  var http = location.protocol === 'http:' || location.protocol === 'https:';

  copyText(url, function(ok){
    if (ok){ hapticNotify('success'); toast('Table of contents link copied'); }
    else { hapticNotify('error'); toast('Failed to copy the link'); }
  });
});

licenseValid(cfg.licensee, cfg.license_key).then(function(ok){

    var b = document.getElementById('banner');
    b.style.display = 'block';
    b.textContent = 'License key not verified. Demo mode is active — enter the correct details in config.js or contact the seller.';
  }
});
load();
loadTopics();
})();
